services:
  steam-exporter:
    build: .
    command: ["python", "scripts/steam_player_exporter.py"]
    environment:
      STEAM_APPID: ${STEAM_APPID:-730}
      STEAM_EXPORTER_HOST: 0.0.0.0
      STEAM_EXPORTER_PORT: 8000
      STEAM_EXPORTER_METRIC_NAME: ${AUTOSCALER_METRIC_NAME:-steam_player_count}
      STEAM_REQUEST_TIMEOUT_SECONDS: ${STEAM_REQUEST_TIMEOUT_SECONDS:-5}
    init: true
    restart: unless-stopped

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.7.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - steam-exporter
    restart: unless-stopped

  autoscaler:
    build: .
    ports:
      - "127.0.0.1:${AUTOSCALER_METRICS_PORT:-8001}:8001"
    environment:
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      AUTOSCALER_INTERVAL_SECONDS: ${AUTOSCALER_INTERVAL_SECONDS:-30}
      AUTOSCALER_STRATEGY: ${AUTOSCALER_STRATEGY:-threshold}
      AUTOSCALER_GAMES_CONFIG: ${AUTOSCALER_GAMES_CONFIG:-}
      AUTOSCALER_METRIC_NAME: ${AUTOSCALER_METRIC_NAME:-steam_player_count}
      AUTOSCALER_LABELS: ${AUTOSCALER_LABELS:-appid=730}
      AUTOSCALER_METRICS_HOST: 0.0.0.0
      AUTOSCALER_METRICS_PORT: 8001
      AUTOSCALER_VM_COST_PER_HOUR: ${AUTOSCALER_VM_COST_PER_HOUR:-0.10}
      AUTOSCALER_FIXED_BASELINE_INSTANCES: ${AUTOSCALER_FIXED_BASELINE_INSTANCES:-4}
      AUTOSCALER_PLAYER_HISTORY_PATH: ${AUTOSCALER_PLAYER_HISTORY_PATH:-/app/data/player_history.csv}
    volumes:
      - ./games.example.toml:/app/games.example.toml:ro
      - ./data:/app/data
    depends_on:
      - prometheus
      - steam-exporter
    init: true
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.2.0}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
