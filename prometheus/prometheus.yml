global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The Compose stack provides this exporter. Replace the target if you run
  # another exporter elsewhere.
  - job_name: game_players
    metrics_path: /metrics
    static_configs:
      - targets: ["steam-exporter:8000"]

  - job_name: autoscaler
    metrics_path: /metrics
    static_configs:
      - targets: ["autoscaler:8001"]

  # Host process controlling the explicitly owned real OpenStack VM pool.
  # Prefix its metrics so existing fake-demo dashboards keep their meaning.
  - job_name: moria_vm_autoscaler
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8002"]
        labels:
          appid: "730"
          pool: ruby-acorn
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "(.+)"
        target_label: __name__
        replacement: "moria_${1}"
