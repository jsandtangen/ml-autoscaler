global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Supply an exporter on the host, or replace this target with your exporter.
  # It must expose steam_player_count{appid="730"} at /metrics.
  - job_name: game_players
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
