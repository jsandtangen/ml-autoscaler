global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The Compose stack provides this exporter. Replace the target if you run
  # another exporter elsewhere.
  - job_name: game_players
    metrics_path: /metrics
    static_configs:
      - targets: ["steam-exporter:8000"]

  - job_name: autoscaler
    metrics_path: /metrics
    static_configs:
      - targets: ["autoscaler:8001"]
